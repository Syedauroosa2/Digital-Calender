<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="click-box">
            <h1 id="time">00:00:00</h1>
            <p id="full-date"></p>
        </div>

        <!-- container section  -->
         <div class="calendar">
            <div class="calendar-header">
                <h2 id="month-year"></h2>
            </div>

            <div class="days-of-weeks">
             <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thurs</div>
            <div>Fri</div>
            <div>Sat</div>
            </div>

            <div id="calendar-days" class="calendar-days"></div>
         </div>
    </div>

    <script src="./app.js"></script>

</body>
</html>
